syndicate:
  name: "Shakedown Syndicate"
  formed: "2026-09-04"
  oracle_ref: "template"   # replaced by genesis.sig at provisioning

template:   # lineage: what this repo tracks, and from where.
            # The commit below is the OLDEST commit the template repo still
            # has, not the one this repo was generated from - generation
            # predates the template's own history, so no commit describes it.
            # Everything since was propagated file by file, which is exactly
            # the state lineage-by-commit replaces. Anchoring here makes the
            # first drift run over-report rather than under-report: a checklist
            # with items already applied costs a read, a false "in sync" costs
            # the thing the check exists for.
  repo: "bigDSanalyst/syndicate-genesis"
  ref: "main"
  commit: "c599ca536cc3651f1d8e3e372ce2ca175cf7efbc"
  recorded: "2026-09-17"

members:   # ONE ROW PER MEMBER, EDIT AT GENESIS
  - name: "Nicholas Maino"
    github: "bigDSanalyst"
    orcid: "0000-0000-0000-0000"
    email: "51167247+bigDSanalyst@users.noreply.github.com"
    role: "founder"
    trust_tier: verified
    joined: "2026-09-04"

  - name: "Test Engineer"
    github: "satsolverv124"
    orcid: "0000-0000-0000-0000"
    email: "205302507+satsolverv124@users.noreply.github.com"
    emails: ["maiknown@gmail.com"]   # web-UI vs laptop; both are this member (row 29)
    role: "systems"
    trust_tier: verified
    joined: "2026-09-04"

governance:
  decision_rule: "majority"
  objection_window_days: 7
  review_gates:   # NOTE: gates auto-cap at members-1; a gate higher than that deadlocks
    "vault/40-drafts/**": 1
    "ledger/**": 1
    "agreements/**": 1

attribution:
  clock: "push-webhook"   # v1 tooling uses committer dates; see attribution.py docstring
  weights: {churn: 0.35, review: 0.25, prompts: 0.20, breadth: 0.20}
  exclude_authors_matching:
    - '\[bot\]$'
    - "ingest-bot@users.noreply.github.com$"
    - "anchor-bot@users.noreply.github.com$"

exit:
  default_split: "per-ledger"
  # Zenodo first: the route with no institutional gate. arXiv needs an
  # endorsement for a first submission in a category - see docs/PUBLICATION.md
  # in the template.
  archive_targets: [zenodo, arxiv]
