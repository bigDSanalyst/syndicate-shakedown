name: ingest-arxiv
on:
  # Schedule disabled per ledger row 51: arXiv returns HTTP 406 to GitHub
  # Actions' Azure egress, so a scheduled run here failed every morning and
  # taught everyone to ignore a red check. Manual dispatch only until the
  # egress decision lands (notebook cadence, self-hosted runner, or OAI-PMH).
  # Proven both ways: 7 header variants from 2 repos refused from Azure; the
  # identical code ingested 27 notes from a Google Cloud address.
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: repo-write, cancel-in-progress: false}
jobs:
  arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: "${{ secrets.SYNDICATE_PAT }}"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: python tools/ingest_arxiv.py --config agents/queries.yaml --out vault/10-literature
      - name: sync with any human pushes
        run: |
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
      - name: commit
        run: |
          git config user.name  "syndicate-ingest[bot]"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add vault/
          git diff --cached --quiet || (git commit -m "ingest: arXiv $(date -u +%F)"
          for i in 1 2 3; do git push origin "HEAD:${{ github.ref_name }}" && exit 0; git fetch origin "${{ github.ref_name }}" && git rebase "origin/${{ github.ref_name }}"; sleep 2; done; exit 1)
